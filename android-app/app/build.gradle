plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.ahmedelfashny.official"
    compileSdk 36

    defaultConfig {
        applicationId "com.ahmedelfashny.official"
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "1.0.2"

        buildConfigField "String", "LIVE_SITE_URL", "\"https://ahmedelfashny.com/\""
        buildConfigField "String", "LIVE_SITE_HOST", "\"ahmedelfashny.com\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile").trim())
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "WEB_DEBUGGING", "true"
        }

        release {
            buildConfigField "boolean", "WEB_DEBUGGING", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/mobileNavigation"))
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/offlineContent"))

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundle the website's exact navigation, without maintaining a separate app UI.
def syncMobileNavigation = tasks.register("syncMobileNavigation", Sync) {
    from(rootProject.file("..")) {
        include "mobile-nav.css", "mobile-nav.js"
    }
    into(layout.buildDirectory.dir("generated/mobileNavigation"))
}
tasks.named("preBuild").configure { dependsOn(syncMobileNavigation) }

def generateOfflineContent = tasks.register("generateOfflineContent", Exec) {
    workingDir rootProject.file("..")
    commandLine(System.getenv("PYTHON") ?: "python", "scripts/generate_app_content.py",
            "--seed", layout.buildDirectory.dir("generated/offlineContent/offline").get().asFile.absolutePath)
}
tasks.named("preBuild").configure { dependsOn(generateOfflineContent) }

dependencies {
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    // Last stable WebKit line supporting the existing Android 6 (API 23) floor.
    //noinspection GradleDependency
    implementation "androidx.webkit:webkit:1.15.0"
    // Keep Android 6 support; WorkManager 2.12 raises its minimum to API 24.
    //noinspection GradleDependency
    implementation "androidx.work:work-runtime:2.11.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260814"
}
